           L 14.8,50.0 Q 12.2,48.5 12.2,45.5 L 12.2,27.1
           Q 12.2,24.1 14.8,22.6 L 30.4,13.6 Q 33.0,12.1 35.6,13.6 Z"
        fill="#2E4230"/>
  <circle cx="33" cy="13" r="6" fill="#C05A3C"/>
</svg>
